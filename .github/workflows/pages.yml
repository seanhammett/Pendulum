# Publishes the simulator to GitHub Pages from the same folder Chrome loads as
# an unpacked extension. One source tree, so the site and the extension cannot
# drift: index.html here is the index.html background.js opens.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # An allowlist rather than a delete-list: a new file has to be named here
      # to reach the web. That keeps manifest.json and background.js (Chrome's
      # half of the repo, meaningless over HTTP) and ref/ (source material,
      # not mine to republish) off the site by default.
      - name: Stage the site
        run: |
          mkdir _site
          cp index.html index.css index.js i18n.js export.js _site/
          cp -r icons _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
