<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Web build only; the extension is always a desktop tab. Without the
       viewport tag a phone pins the layout to 980px and zooms out, leaving the
       720px breakpoint in index.css unreachable. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simulate a double or triple pendulum with real physics. Set rod lengths, gravity, and initial angles and speeds, and change them mid-flight.">
  <!-- Matches --bg in index.css, so mobile browser chrome extends the page. -->
  <meta name="theme-color" content="#12151d">
  <title>Pendulum Simulator</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pendulum Simulator">
  <meta property="og:description" content="Simulate a double or triple pendulum with real physics. Set rod lengths, gravity, and initial angles and speeds, and change them mid-flight.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="icons/icon128.png">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main id="stage-wrap">
    <canvas id="stage"></canvas>
  </main>

  <aside class="panel">
    <div class="buttons">
      <button id="play" class="primary">Start</button>
      <button id="reset" data-i18n="btn.reset">Reset</button>
      <!-- Shows the language you are not in, i.e. what clicking gets you. -->
      <button id="lang">EN</button>
    </div>

    <fieldset id="flight">
      <legend><label class="check activate" data-i18n-title="flight.tip"><input id="flight-on" type="checkbox" checked><span data-i18n="flight.legend">Flight simulator</span></label></legend>

      <canvas id="profile" height="52"></canvas>

      <div class="flight-now">
        <span id="f-phase">Baseline</span>
        <b id="f-g">1.00 g</b>
      </div>
      <div class="flight-meta">
        <span id="f-para">Parabola 1</span>
        <span id="f-t">t = 0.0 s of 180</span>
      </div>

      <!-- Gravity sits with the flight simulator because the profile is what
           normally writes it: the readout above says what the aircraft is
           pulling, this says what the world is under, and the note below says
           which of the two is holding the pen. It is the one value here that
           belongs to no single pendulum, so it is also the one that has no
           business in Architecture, which follows the tab.

           Locked, not hidden, while the profile flies — you can still read the
           number the profile is writing. -->
      <div class="row gap">
        <label for="g">g <small>m/s&sup2;</small></label>
        <input id="g-range" type="range" min="-20" max="30" step="0.01" value="9.81">
        <input id="g" type="number" min="-20" max="30" step="0.01" value="9.81">
      </div>

      <p id="g-driven" class="driven" data-i18n="flight.driven" hidden>g is driven by the flight profile</p>

      <!-- Hidden, not deleted: the presets still wire up, so they can be shown
           again by dropping the attribute. -->
      <div class="presets" hidden>
        <button data-g="1.62" data-i18n="preset.moon">Moon</button>
        <button data-g="3.72" data-i18n="preset.mars">Mars</button>
        <button data-g="9.81" data-i18n="preset.earth">Earth</button>
        <button data-g="24.79" data-i18n="preset.jupiter">Jupiter</button>
        <button data-g="0" data-i18n="preset.zero">Zero</button>
      </div>

      <div class="row gap" data-i18n-title="release.tip">
        <label for="release"><span data-i18n="release.label">Release</span> <small>s</small></label>
        <input id="release-range" type="range" min="0" max="180" step="0.5" value="0">
        <input id="release" type="number" min="0" max="180" step="0.5" value="0">
      </div>
      <!-- Built in JS from release.note, since the sentence reorders between
           languages; the r-* spans are recreated each time. -->
      <p id="release-note" class="release-note"></p>

      <label class="check foot" data-i18n-title="shortcut.tip"><input id="shortcut" type="checkbox"><span data-i18n="shortcut.label">Shortcut 1g baseline</span></label>
    </fieldset>

    <!-- All three pendulums at once, one row each, rather than following the
         selected tab as State does. There is no all-chains sum.

         So the legend names no pendulum and carries no dot; each row carries its
         own, filled for a pendulum on the pivot and a bare ring for one that is
         not, as the tabs read. An off pendulum is not being stepped, so its row
         shows it at its initial conditions — the hollow dot and the dimmed
         figures are what say those numbers will not move.

         The unit is in the legend rather than after all nine figures. -->
    <fieldset class="energy">
      <legend><span data-i18n="energy.legend">Energy</span> <small data-i18n="energy.unit">&mdash; J</small></legend>
      <div class="e-grid">
        <div class="e-head">
          <span></span>
          <span data-i18n="energy.potential">Potential</span>
          <span data-i18n="energy.kinetic">Kinetic</span>
          <span data-i18n="energy.total">Total</span>
        </div>
        <div class="e-row" id="e-row-1"><i class="dot p1"></i><b id="e-pe-1">0.00</b><b id="e-ke-1">0.00</b><b class="e-tot" id="e-total-1">0.00</b></div>
        <div class="e-row" id="e-row-2"><i class="dot p2"></i><b id="e-pe-2">0.00</b><b id="e-ke-2">0.00</b><b class="e-tot" id="e-total-2">0.00</b></div>
        <div class="e-row" id="e-row-3"><i class="dot p3"></i><b id="e-pe-3">0.00</b><b id="e-ke-3">0.00</b><b class="e-tot" id="e-total-3">0.00</b></div>
      </div>
    </fieldset>

    <fieldset>
      <legend><span data-i18n="arch.legend">Architecture</span> <small data-i18n="arch.sub">&mdash; live</small></legend>

      <!-- One tab per pendulum, each carrying its chain's colour as a dot, and
           lettered where bobs are numbered so B2 needs no explaining.

           All three are always here, and a tab is a selection and nothing else:
           clicking one brings that pendulum's settings into the rest of the box
           whether it is hanging or not. Whether it hangs is said by the dot and
           changed by the switch below.

           The dot is a child element rather than part of the label, since
           data-i18n would overwrite the text; the letters are not translated, so
           the tabs carry their name in the tooltip. -->
      <div class="tabs">
        <button class="tab on" id="tab-1" title=""><i class="dot p1"></i>A</button>
        <button class="tab" id="tab-2" title=""><i class="dot p2"></i>B</button>
        <button class="tab" id="tab-3" title=""><i class="dot p3"></i>C</button>
      </div>

      <!-- Off and the three link counts are one control: "no rods" and "not on
           the pivot" are the same pendulum. It spans the box, with the tabs
           above as its label, since four segments do not fit beside one. -->
      <div class="seg arch" role="group" data-i18n-aria="arch.links" data-i18n-title="arch.links.tip">
        <button id="links-0" data-i18n="arch.off">Off</button>
        <button id="links-1" class="on" data-i18n="arch.single">Single</button>
        <button id="links-2" data-i18n="arch.double">Double</button>
        <button id="links-3" data-i18n="arch.triple">Triple</button>
      </div>

      <!-- The boxes open on pendulum A, and index.js reads its defaults back out
           of them, so the markup states what the page loads with.

           Lengths step in millimetres where everything else steps in hundredths,
           so the 0.994 m default survives a nudge of the slider. That length is
           the seconds pendulum, L = g/π², a half-period of exactly 1 s at
           9.81 m/s². It is also the reach every pendulum starts with: A spends
           it on one rod, B on two, C on three. -->
      <div class="row gap">
        <label for="L1">L<sub>1</sub> <small>m</small></label>
        <input id="L1-range" type="range" min="0.1" max="3" step="0.001" value="0.994">
        <input id="L1" type="number" min="0.1" max="3" step="0.001" value="0.994">
      </div>
      <div class="row">
        <label for="m1">m<sub>1</sub> <small>kg</small></label>
        <input id="m1-range" type="range" min="0.1" max="5" step="0.01" value="2">
        <input id="m1" type="number" min="0.1" max="5" step="0.01" value="2">
      </div>
      <!-- The second and third links are always wired; only their rows come and
           go. A is a single, so these hold C's links — what A becomes if it is
           switched to a longer chain; see DEFAULTS in index.js. They are finer
           than the slider's millimetre, so nudging it rounds them. -->
      <div class="row gap" id="row-L2">
        <label for="L2">L<sub>2</sub> <small>m</small></label>
        <input id="L2-range" type="range" min="0.1" max="3" step="0.001" value="0.33133">
        <input id="L2" type="number" min="0.1" max="3" step="0.001" value="0.33133">
      </div>
      <div class="row" id="row-m2">
        <label for="m2">m<sub>2</sub> <small>kg</small></label>
        <input id="m2-range" type="range" min="0.1" max="5" step="0.01" value="1.8">
        <input id="m2" type="number" min="0.1" max="5" step="0.01" value="1.8">
      </div>
      <div class="row gap" id="row-L3" hidden>
        <label for="L3">L<sub>3</sub> <small>m</small></label>
        <input id="L3-range" type="range" min="0.1" max="3" step="0.001" value="0.21767">
        <input id="L3" type="number" min="0.1" max="3" step="0.001" value="0.21767">
      </div>
      <div class="row" id="row-m3" hidden>
        <label for="m3">m<sub>3</sub> <small>kg</small></label>
        <input id="m3-range" type="range" min="0.1" max="5" step="0.01" value="1">
        <input id="m3" type="number" min="0.1" max="5" step="0.01" value="1">
      </div>
      <div class="row gap" data-i18n-title="arch.friction.tip">
        <label for="b">b <small>N&middot;m&middot;s</small></label>
        <input id="b-range" type="range" min="0" max="2" step="0.001" value="0.001">
        <input id="b" type="number" min="0" max="2" step="0.001" value="0.001">
      </div>
    </fieldset>

    <fieldset>
      <legend><span data-i18n="init.legend">Initial conditions</span> <small data-i18n="init.sub">&mdash; on Reset</small></legend>
      <!-- One row per link, angle then speed, so a third link appends a row
           rather than reflowing the pairs already there. -->
      <div class="grid">
        <label><span>&theta;<sub>1</sub> <small>&deg;</small></span><input id="t1" type="number" value="90" step="1"></label>
        <label><span>&omega;<sub>1</sub> <small>&deg;/s</small></span><input id="w1" type="number" value="0" step="1"></label>
        <label id="init-t2"><span>&theta;<sub>2</sub> <small>&deg;</small></span><input id="t2" type="number" value="0" step="1"></label>
        <label id="init-w2"><span>&omega;<sub>2</sub> <small>&deg;/s</small></span><input id="w2" type="number" value="0" step="1"></label>
        <label id="init-t3" hidden><span>&theta;<sub>3</sub> <small>&deg;</small></span><input id="t3" type="number" value="0" step="1"></label>
        <label id="init-w3" hidden><span>&omega;<sub>3</sub> <small>&deg;/s</small></span><input id="w3" type="number" value="0" step="1"></label>
      </div>
      <button id="use-current" class="wide" data-i18n="init.use">Use current state as initial</button>
    </fieldset>

    <fieldset>
      <legend data-i18n="trails.legend">Trails</legend>
      <!-- Every traceable bob on one line, not following the Architecture tab,
           so two chains can be compared without switching tabs. Nine at most,
           as numerals grouped behind their chain's letter in its own colour.

           Lit rather than ticked, like the architecture tabs. The checkbox is
           still underneath — it holds the state and takes the keyboard focus —
           it is simply not drawn.

           Bob 1 appears only on a single pendulum. Each group starts on its
           chain's tip alone, which is the rule setLinks keeps to. -->
      <div class="trail-bar">
        <span class="trail-set" id="trail-row-1"><b class="name p1">A</b>
          <label class="tog" id="trail-1-1-row" title=""><input id="trail-1-1" type="checkbox" checked>1</label>
          <label class="tog" id="trail-1-2-row" title="" hidden><input id="trail-1-2" type="checkbox">2</label>
          <label class="tog" id="trail-1-3-row" title="" hidden><input id="trail-1-3" type="checkbox">3</label>
        </span>
        <span class="trail-set" id="trail-row-2"><b class="name p2">B</b>
          <label class="tog" id="trail-2-1-row" title="" hidden><input id="trail-2-1" type="checkbox">1</label>
          <label class="tog" id="trail-2-2-row" title=""><input id="trail-2-2" type="checkbox" checked>2</label>
          <label class="tog" id="trail-2-3-row" title="" hidden><input id="trail-2-3" type="checkbox">3</label>
        </span>
        <span class="trail-set" id="trail-row-3"><b class="name p3">C</b>
          <label class="tog" id="trail-3-1-row" title="" hidden><input id="trail-3-1" type="checkbox">1</label>
          <label class="tog" id="trail-3-2-row" title=""><input id="trail-3-2" type="checkbox">2</label>
          <label class="tog" id="trail-3-3-row" title=""><input id="trail-3-3" type="checkbox" checked>3</label>
        </span>
      </div>
      <div class="row gap" data-i18n-title="trails.style.tip">
        <label data-i18n="trails.style">Style</label>
        <div class="seg">
          <button id="trail-dots" data-i18n="trails.dots">Dots</button>
          <button id="trail-line" class="on" data-i18n="trails.line">Line</button>
        </div>
      </div>
      <div class="row">
        <label for="trail-len"><span data-i18n="trails.length">Length</span> <small>s</small></label>
        <input id="trail-len-range" type="range" min="1" max="60" step="1" value="25">
        <input id="trail-len" type="number" min="1" max="60" step="1" value="25">
      </div>
      <button id="clear" class="wide" data-i18n="trails.clear">Clear trails</button>
    </fieldset>

    <!-- Driven by export.js, which index.js knows nothing about: delete this
         fieldset and the <script> tag at the foot of the page and the feature
         is gone with no other trace.

         A span is two times rather than one of the nine phases, since the useful
         pictures cross them. The line under the boxes names whichever phases the
         span covers, and the span is drawn on the profile above. -->
    <fieldset id="export">
      <legend data-i18n="export.legend">Export</legend>
      <div class="row span-row" title="" data-i18n-title="export.tip">
        <label for="export-from"><span data-i18n="export.span">Span</span> <small>s</small></label>
        <input id="export-from" type="number" min="0" max="180" step="1" value="35">
        <input id="export-to" type="number" min="0" max="180" step="1" value="57">
      </div>
      <p id="export-phases" class="export-phases"></p>
      <div class="export-buttons">
        <button id="export-png" data-i18n="export.png" disabled>PNG</button>
        <button id="export-svg" data-i18n="export.svg" disabled>SVG</button>
      </div>
      <!-- Two independent toggles, so an unattended run can write both formats
           or either alone. -->
      <div class="row auto-row" title="" data-i18n-title="export.auto.tip">
        <label data-i18n="export.auto">Auto</label>
        <span class="trail-set">
          <label class="tog" id="auto-png-row"><input id="auto-png" type="checkbox">PNG</label>
          <label class="tog" id="auto-svg-row"><input id="auto-svg" type="checkbox">SVG</label>
        </span>
      </div>
      <p id="export-status" class="export-status"></p>
      <p id="export-auto" class="export-status"></p>
    </fieldset>

    <fieldset class="readout">
      <legend><i class="dot p1" id="dot-state"></i><span id="legend-state">State</span></legend>
      <div><span>&theta;<sub>1</sub></span><b id="r-t1">0&deg;</b></div>
      <div><span>&omega;<sub>1</sub></span><b id="r-w1">0&deg;/s</b></div>
      <div id="r-row-t2"><span>&theta;<sub>2</sub></span><b id="r-t2">0&deg;</b></div>
      <div id="r-row-w2"><span>&omega;<sub>2</sub></span><b id="r-w2">0&deg;/s</b></div>
      <div id="r-row-t3" hidden><span>&theta;<sub>3</sub></span><b id="r-t3">0&deg;</b></div>
      <div id="r-row-w3" hidden><span>&omega;<sub>3</sub></span><b id="r-w3">0&deg;/s</b></div>
      <div><span data-i18n="state.time">Time</span><b id="r-time">0.00 s</b></div>
      <div class="perf lead" title="" data-i18n-title="state.rate.tip"><span data-i18n="state.rate">Rate</span><b id="r-fps">— fps</b></div>
      <div class="perf" title="" data-i18n-title="state.cost.tip"><span data-i18n="state.cost">JS</span><b id="r-cost">—</b></div>
    </fieldset>
  </aside>

  <!-- The one question this page ever asks. A native <dialog>, so showModal()
       handles centring, the backdrop, the focus trap and Escape. The text is
       written in from the string table. -->
  <dialog id="ask" class="ask">
    <h2 id="ask-title"></h2>
    <p id="ask-text"></p>
    <div class="ask-buttons">
      <button id="ask-no" data-i18n="btn.cancel">Cancel</button>
      <button id="ask-yes" class="primary" data-i18n="btn.continue">Continue</button>
    </div>
  </dialog>

  <script src="i18n.js"></script>
  <script src="index.js"></script>
  <!-- After index.js, and it must be: both are classic scripts, so export.js
       reads index.js's top-level bindings without either exporting anything.
       Purely additive — remove this line and the page is unchanged. -->
  <script src="export.js"></script>
</body>
</html>
